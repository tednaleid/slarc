[project]
name = "slarc"
version = "0.3.0"
description = "Archive the Slack conversations you can see into searchable, re-renderable files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ted Naleid", email = "contact@naleid.com" }]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "duckdb==2.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "msgspec>=0.22.0",
    "pygments>=2.21.0",
    "pytz>=2026.5",
    "rich>=15.0.0",
    "secretstorage>=3.5.0 ; sys_platform == 'linux'",
    "slack-sdk>=3.45.0",
    "typer>=0.15",
    "websocket-client>=1.9.2",
]

[project.scripts]
slarc = "slarc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.9",
    "ty==0.0.89",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# The Homebrew formula installs the locked dependency versions from the sdist.
[tool.uv.build-backend]
source-include = ["uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
