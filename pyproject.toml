[project]
name = "slarc"
version = "0.1.0"
description = "Archive the Slack conversations you can see into searchable, re-renderable files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ted Naleid", email = "contact@naleid.com" }]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
slarc = "slarc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.9",
    "ty==0.0.89",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
